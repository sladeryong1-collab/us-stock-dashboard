name: Update US Stock Prices

# 자동 실행 문제(60일 비활동 자동 비활성화, 권한 문제, cron 문법 오류 등) 방지용으로
# 아래 항목들을 신경 써서 작성했어요:
#   - permissions: contents: write  → 결과를 저장소에 다시 커밋할 권한을 명시적으로 부여
#   - cron 표현식을 따옴표로 감싸고 5필드 표준 문법 사용 (@daily 같은 축약형 미사용)
#   - workflow_dispatch → "Actions" 탭에서 수동으로 즉시 테스트 실행 가능
#   - 이 파일은 반드시 default 브랜치(main)에 있어야 스케줄이 인식됩니다.

on:
  schedule:
    # 매일 UTC 23:00 = 한국시간(KST) 다음날 08:00에 실행
    # (미국 정규장 마감 이후 시간이라 종가가 이미 확정된 시점이에요)
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch closing prices
        run: python scripts/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json tickers_cache.json
          git diff --staged --quiet || git commit -m "chore: update prices ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
